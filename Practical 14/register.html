<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>STUDENTHUB PORTAL</h1>
</header>

<nav>
    <a href="index.php">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
</nav>

<form action="register.php" method="post">

    <h1>Create an Account</h1>

    <br>

    <div style="text-align: left; margin-bottom: 8px;">Register As :</div>

    <label style="display: inline-flex; align-items: center; gap: 6px; margin-right: 20px; cursor: pointer;">
        <input type="radio" name="role" value="student" checked style="width: 16px; height: 16px; margin: 0;">
        <span>Student</span>
    </label>

    <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
        <input type="radio" name="role" value="teacher" style="width: 16px; height: 16px; margin: 0;">
        <span>Teacher</span>
    </label>

    <br><br>

    <input type="text" placeholder="Enter Full Name" id="name" name="name" required>

    <br><br>

    <input type="email" placeholder="Enter E-mail ID" id="id" name="email" required>

    <br><br>

    <input type="tel" placeholder="Enter Phone Number" id="phone" name="phone" required>

    <br><br>

    <input type="password" placeholder="Enter Password (min 8 chars)" id="password" name="password" required>

    <br><br>

    <input type="password" placeholder="Confirm Password" id="confirm" name="confirm" required>

    <br><br>

    <button type="button">Continue with Google</button>

    <br><br>

    <button type="submit" id="btn">Create Account</button>

    <div id="msg" style="font-size: 13px; color: rgb(195, 100, 100); margin-top: 10px;"></div>

</form>

<script src="register.js"></script>

</body>

</html>
