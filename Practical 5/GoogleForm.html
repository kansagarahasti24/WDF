<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
        <script src="script.js"></script>
    </head>
    <body bgcolour="light blue">
        <form onsubmit="return checkInput()">
            <table align="center" width="800" cellpadding="10">
                <tr>
                    <td colspan="2" align="center">
                        <h1>Student Registration Form</h1>
                    </td>
                </tr>

            <tr>
                <td>Student Name :</td>
                <td>
                    <input type="text" size="50" placeholder="Enter Your Name" id="name"/><br>
                    <span id="s1" style="font-size: 12px; color: rgb(195,100,100);"></span>
                </td>
            </tr>

            <tr>
                <td>Date Of Birth :</td>
                <td>
                    <input type="text" size="12" placeholder="dd/mm/yyyy" id="dob" /><br>
                    <span id="s2" style="font-size: 12px; color: rgb(195,100,100);"></span> 
                    
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input type="text" size="1" placeholder="+91"/>
                    <input type="text" size="10" id="phone" onkeyup="checkPhone()"/><br>
                    <span id="s3" style="font-size: 12px; color: rgb(195,100,100);"></span> 

                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td>
                    <input type="text" size="50" id="email" onkeyup="checkEmail()"/><br>
                    <span id="s4" style="font-size: 12px; color: rgb(195,100,100);"></span> 

                </td>
            </tr>

            <tr>
                <td>Password :</td>
                <td>
                    <input type="password" size="50" id="password" onkeyup="checkPassword()"/><br>
                    <span id="s5" style="font-size: 12px; color: rgb(195,100,100);"></span>
                </td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="g" />Male
                    <input type="radio" name="g" />Female<br>
                    <span id="s7" style="font-size: 12px; color: rgb(195,100,100);"></span>
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox" name="department" />CSE
                    <input type="checkbox" name="department" />CE
                    <input type="checkbox" name="department" />IT
                    <input type="checkbox" name="department" />CL
                    <input type="checkbox" name="department" />EC<br>
                    <span id="s8" style="font-size: 12px; color: rgb(195,100,100);"></span>
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select id="course">
                        <option> Select Course </option>
                        <option>Python</option>
                        <option>Java</option>
                        <option>DSA</option>
                        <option>WDE</option>
                        <option>PHP</option>
                    </select><br>
                    <span id="s9" style="font-size: 12px; color: rgb(195,100,100);"></span>
                </td>
            </tr>

            <tr>
                <td>Student Photo :</td>
                <td>
                    <input type="file" />
                </td>
            </tr>

            <tr>
                <td>City :</td>
                <td>
                    <input type="text" size="50" id="city" /><br>
                    <span id="s10" style="font-size: 12px; color: rgb(195,100,100);"></span>
                </td>
            </tr>

            <tr>
                <td>Address :</td>
                <td>
                    <textarea cols="45" rows="5" id="address"></textarea><br>
                    <span id="s6" style="font-size: 12px; color: rgb(195,100,100);"></span>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button type="submit" id="btn">Submit</button>
                </td>
            </tr>
            </table>
        </form>
    </body>
</html>
